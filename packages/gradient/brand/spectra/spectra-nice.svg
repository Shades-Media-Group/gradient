  <rect x="74.5" y="9" width="11" height="49" rx="5.5" fill="#FFC4CF"/>
  <rect x="89" y="22" width="11" height="36" rx="5.5" fill="#FF8299"/>
  <rect x="34" y="50" width="92" height="92" rx="28" fill="#E40523"/>
  <path d="M58 91 Q66 84 74 91" stroke="#0A0A0B" stroke-width="4.5" stroke-linecap="round" fill="none"/>
